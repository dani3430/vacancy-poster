name: Relay vacancies

on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # every 10 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch: {}        # lets you press "Run workflow" manually

permissions:
  contents: write              # needed to save state.json back to the repo

concurrency:
  group: vacancy-relay         # never run two at once (would double-post)
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run relay
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
        run: python bot.py

      - name: Save progress (state.json)
        run: |
          git config user.name "vacancy-bot"
          git config user.email "vacancy-bot@users.noreply.github.com"
          if [ -f state.json ]; then cp state.json /tmp/state.json; fi
          git fetch origin main
          git reset --hard origin/main
          if [ -f /tmp/state.json ]; then cp /tmp/state.json state.json; fi
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "update state [skip ci]"
            git push origin HEAD:main
          fi
